name: Rebuild roster from VDB

on:
  schedule:
    # 每周一 UTC 04:00 ≈ 北京时间中午
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild roster
        run: python scripts/build_roster.py --force-vdb
      - name: Commit roster if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roster.json
          git diff --staged --quiet || (git commit -m "chore: refresh VR/PSP roster from VDB" && git push)
