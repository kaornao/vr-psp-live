<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="VirtuaReal / P-SP（PSPlive）B站开播看板" />
  <title>VR / PSP 开播看板</title>
  <style>
    :root {
      --bg: #0f1218;
      --panel: #171c26;
      --text: #e8ecf4;
      --muted: #8b95a8;
      --vr: #5b8cff;
      --psp: #ff7ab6;
      --live: #3dd68c;
      --border: #2a3344;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1a2740 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1.25rem 1.5rem 0.35rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: baseline;
      justify-content: space-between;
    }
    h1 { font-size: 1.35rem; font-weight: 650; margin: 0; }
    .meta { color: var(--muted); font-size: 0.85rem; }
    .blurb {
      padding: 0 1.5rem 0.85rem;
      color: var(--muted);
      font-size: 0.9rem;
      max-width: 52rem;
      line-height: 1.5;
    }
    .stats { display: flex; gap: 0.6rem; flex-wrap: wrap; padding: 0 1.5rem 1rem; }
    .pill {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.35rem 0.85rem;
      font-size: 0.85rem;
    }
    .pill strong { color: var(--live); }
    .pill.vr strong { color: var(--vr); }
    .pill.psp strong { color: var(--psp); }
    .toolbar {
      padding: 0 1.5rem 1rem;
      display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;
    }
    button, select {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.4rem 0.75rem;
      cursor: pointer;
    }
    button:hover { border-color: #4a5a75; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 0.85rem;
      padding: 0 1.5rem 2rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: border-color .15s, transform .15s;
    }
    .card:hover { border-color: #4d6288; transform: translateY(-1px); }
    .cover {
      aspect-ratio: 16/9;
      background: #0a0d12 center/cover no-repeat;
      position: relative;
    }
    .badge {
      position: absolute;
      top: 8px; left: 8px;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.45rem;
      border-radius: 6px;
      background: rgba(0,0,0,.55);
    }
    .badge.vr { color: var(--vr); }
    .badge.psp { color: var(--psp); }
    .online {
      position: absolute;
      top: 8px; right: 8px;
      font-size: 0.7rem;
      padding: 0.2rem 0.45rem;
      border-radius: 6px;
      background: rgba(61,214,140,.18);
      color: var(--live);
    }
    .body { padding: 0.75rem 0.85rem 0.95rem; }
    .name { font-weight: 650; margin: 0 0 0.25rem; }
    .title { color: var(--muted); font-size: 0.85rem; line-height: 1.35; margin: 0; }
    .area { color: var(--muted); font-size: 0.75rem; margin-top: 0.45rem; }
    .empty {
      margin: 2rem 1.5rem;
      padding: 1.5rem;
      border: 1px dashed var(--border);
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
    }
    .err { color: #ff8e8e; padding: 0 1.5rem; }
    footer {
      padding: 0 1.5rem 2rem;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.5;
    }
    footer a { color: #9eb6ff; }
  </style>
</head>
<body>
  <header>
    <h1>VirtuaReal / P-SP 开播看板</h1>
    <div class="meta" id="updated">加载中…</div>
  </header>
  <p class="blurb" id="blurb">维阿（VirtuaReal）与 P-SP（PSPlive）当前开播成员。点卡片进直播间。</p>
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <label>筛选
      <select id="filter">
        <option value="ALL">全部</option>
        <option value="VR">仅 VR</option>
        <option value="PSP">仅 PSP</option>
      </select>
    </label>
    <button type="button" id="reload">刷新显示</button>
  </div>
  <div id="err" class="err" hidden></div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>当前没有人在播。</div>
  <footer>
    名单来源 <a href="https://vdb.vtbs.moe/" rel="noopener" target="_blank">vtbs.moe VDB</a>；
    开播状态来自 B 站公开接口。非官方工具。
    本机请双击 <b>VR-PSP开播看板.html</b>，或运行 <b>一键本地预览.bat</b>（不要只开空的 index.html）。
  </footer>

  <!--EMBED_STATUS-->
  <script>
    const $ = (id) => document.getElementById(id);
    let cache = null;
    const isFile = location.protocol === "file:";

    function fmtNum(n) {
      n = Number(n) || 0;
      if (n >= 10000) return (n / 10000).toFixed(1) + "万";
      return String(n);
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function render() {
      if (!cache) return;
      const filter = $("filter").value;
      const live = (cache.live || []).filter(r => filter === "ALL" || r.bucket === filter);
      const c = cache.counts || {};
      $("updated").textContent = "数据更新于 " + (cache.updated_at || "—");
      $("stats").innerHTML = [
        `<span class="pill">开播 <strong>${c.live ?? 0}</strong> / 名单 ${c.roster ?? 0}</span>`,
        `<span class="pill vr">VR <strong>${c.VR_live ?? 0}</strong></span>`,
        `<span class="pill psp">PSP <strong>${c.PSP_live ?? 0}</strong></span>`,
      ].join("");

      const grid = $("grid");
      grid.innerHTML = "";
      if (!live.length) {
        $("empty").hidden = false;
        return;
      }
      $("empty").hidden = true;
      for (const r of live) {
        const a = document.createElement("a");
        a.className = "card";
        a.href = r.live_url || `https://space.bilibili.com/${r.uid}`;
        a.target = "_blank";
        a.rel = "noopener";
        const cover = (r.cover || "").replace(/'/g, "%27");
        a.innerHTML = `
          <div class="cover" style="background-image:url('${cover}')">
            <span class="badge ${r.bucket === "PSP" ? "psp" : "vr"}">${r.bucket}</span>
            <span class="online">${fmtNum(r.online)} 人气</span>
          </div>
          <div class="body">
            <p class="name">${escapeHtml(r.name)}</p>
            <p class="title">${escapeHtml(r.title || "（无标题）")}</p>
            <div class="area">${escapeHtml([r.parent_area, r.area].filter(Boolean).join(" · "))}</div>
          </div>`;
        grid.appendChild(a);
      }
    }

    async function load() {
      if (typeof window.__STATUS__ === "object" && window.__STATUS__) {
        cache = window.__STATUS__;
        $("err").hidden = true;
        if (isFile) {
          $("blurb").textContent = "这是打包好的单文件看板（可直接双击打开）。要更新数据请再跑一次「一键本地预览.bat」。点卡片进直播间。";
        }
        render();
        return;
      }
      if (isFile) {
        $("err").hidden = false;
        $("err").textContent = "直接打开空模板没用。请双击同目录的「VR-PSP开播看板.html」，或先运行「一键本地预览.bat」。";
        $("updated").textContent = "未加载";
        return;
      }
      try {
        const res = await fetch("./status.json?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        cache = await res.json();
        $("err").hidden = true;
        render();
      } catch (e) {
        $("err").hidden = false;
        $("err").textContent = "读不到 status.json（站点可能还没部署/刷新）。";
        $("updated").textContent = "未加载";
      }
    }

    $("filter").addEventListener("change", render);
    $("reload").addEventListener("click", load);
    load();
    if (!isFile) setInterval(load, 15000);
  </script>
</body>
</html>
